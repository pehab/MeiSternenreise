name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify update routing and APK validation
        run: bash scripts/test-update-contract.sh
      - name: Story, dwell and save tests with coverage gate
        run: ./gradlew :core:check --stacktrace
      - name: Lint both channels and build APKs
        run: ./gradlew :app:lintGithubDebug :app:lintPlayRelease :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MeiSternenreise-test-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/androidTest/github/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: MeiSternenreise-test-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/device-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          path: device-results/
  signed-release:
    needs: [build, device-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent signing identity
        id: signing
        env:
          MEI_SIGNING_JSON: ${{ secrets.MEI_SIGNING_JSON }}
        run: python3 .github/scripts/setup-github-signing.py
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true'
        run: ./gradlew :app:assembleGithubRelease --stacktrace
      - name: Verify certificate
        if: steps.signing.outputs.ready == 'true'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk'
      - name: Publish APK and update feed
        if: steps.signing.outputs.ready == 'true'
        run: python3 .github/scripts/publish-github-update.py
      - name: Signing setup status
        if: steps.signing.outputs.ready != 'true'
        run: echo '::notice::Set the MEI_SIGNING_JSON repository secret to enable installable GitHub releases.'
